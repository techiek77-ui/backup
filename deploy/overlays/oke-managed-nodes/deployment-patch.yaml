apiVersion: apps/v1
kind: Deployment
metadata:
  name: podspawner
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ocirsecret
      volumes:
        - name: size-classes
          configMap:
            name: podspawner-size-classes
      containers:
        - name: controller
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: size-classes
              mountPath: /etc/podspawner
              readOnly: true
          env:
            - name: NODE_MODE
              value: oke
            # Classes and their node pools: edit size-classes.yaml next to
            # this file (mounted through the ConfigMap above).
            - name: SIZE_CLASSES_FILE
              value: /etc/podspawner/size-classes.yaml
            - name: DEFAULT_SIZE_CLASS
              value: small
            # Must match the pools' initial node labels (the pod is also pinned
            # to its node by name; the selector is a second guard).
            - name: WORKER_NODE_SELECTOR
              value: "workload=worker"
            # Scale-up + instance boot + kubelet join. Measure on your tenancy
            # (nodeReadyAt - createdAt on a job) and leave headroom.
            - name: NODE_PROVISION_TIMEOUT
              value: 15m
            # How the controller authenticates to OCI:
            #   auto               workload-identity when running in-cluster
            #   workload-identity  Enhanced clusters; IAM policy on this
            #                      ServiceAccount (README in this directory)
            #   instance-principal Basic clusters; dynamic group + policy
            # Set instance-principal explicitly on a Basic cluster.
            - name: OCI_AUTH_MODE
              value: auto
            # Required for workload-identity (ignored otherwise), e.g. eu-frankfurt-1
            - name: OCI_RESOURCE_PRINCIPAL_REGION
              value: REGION_IDENTIFIER
