# Controller identity: may manage pods only inside its own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podspawner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podspawner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podspawner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podspawner
subjects:
  - kind: ServiceAccount
    name: podspawner
---
# Worker identity: no permissions at all, and no token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podspawner-worker
automountServiceAccountToken: false
