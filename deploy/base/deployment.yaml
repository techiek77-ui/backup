apiVersion: apps/v1
kind: Deployment
metadata:
  name: podspawner
  labels:
    app.kubernetes.io/name: podspawner
spec:
  replicas: 1
  # Recreate, not RollingUpdate: job state is in-memory and a new instance
  # reaps every worker pod on start-up, so two instances must never overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: podspawner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podspawner
    spec:
      serviceAccountName: podspawner
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: podspawner:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Node label(s) worker pods must match. "k=v,k2=v2".
            - name: WORKER_NODE_SELECTOR
              value: "workload=worker"
            - name: WORKER_SERVICE_ACCOUNT
              value: podspawner-worker
            - name: WORKER_DEFAULT_IMAGE
              value: busybox:1.36
            # Pod deadline when a request has no timeoutSeconds, and the cap
            # for timeoutSeconds. Scans are long and variable: pass
            # timeoutSeconds per request and keep the cap as the safety net.
            - name: WORKER_DEFAULT_TIMEOUT
              value: 24h
            - name: WORKER_MAX_TIMEOUT
              value: 24h
            # Fail fast when no node matches the selector.
            - name: WORKER_SCHEDULE_TIMEOUT
              value: 2m
            # Fail fast when the worker image cannot be pulled.
            - name: WORKER_IMAGE_PULL_TIMEOUT
              value: 3m
            # Retry transient API-server errors this long before failing a job.
            - name: API_RETRY_WINDOW
              value: 2m
            # Reap worker pods that no in-flight job owns.
            - name: SWEEP_INTERVAL
              value: 5m
            # --- Size classes and node lifecycle --------------------------
            # Who provides the node a worker pod runs on:
            #   none  Cluster Autoscaler, Karpenter or a virtual-node pool reacts
            #         to the pending pod (see deploy/addons/*)
            #   oke   the controller grows the class's OKE node pool by one, pins
            #         the pod to that node and deletes the node afterwards
            #         (needs OCI credentials; see deploy/overlays/oke-managed-nodes)
            - name: NODE_MODE
              value: none
            # name -> pod resources (requests = limits), extra node selector /
            # tolerations, and in oke mode the node pool to grow.
            - name: SIZE_CLASSES
              value: '{"default":{"cpu":"500m","memory":"256Mi"}}'
            - name: DEFAULT_SIZE_CLASS
              value: default
            # Required pod anti-affinity: two scans never share a node.
            - name: ONE_POD_PER_NODE
              value: "true"
            # oke mode: scale-up + boot + join must complete within this.
            - name: NODE_PROVISION_TIMEOUT
              value: 15m
            - name: MAX_CONCURRENT
              value: "10"
            - name: KEEP_FAILED_PODS
              value: "false"
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
