apiVersion: apps/v1
kind: Deployment
metadata:
  name: podspawner
  labels:
    app.kubernetes.io/name: podspawner
spec:
  replicas: 1
  # Recreate, not RollingUpdate: job state is in-memory and a new instance
  # reaps every worker pod on start-up, so two instances must never overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: podspawner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podspawner
    spec:
      serviceAccountName: podspawner
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: podspawner:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Node label(s) worker pods must match ("k=v,k2=v2").
            - name: WORKER_NODE_SELECTOR
              value: "workload=worker"
            - name: WORKER_SERVICE_ACCOUNT
              value: podspawner-worker
            - name: WORKER_DEFAULT_IMAGE
              value: busybox:1.36
            # Pod deadline when a request has no timeoutSeconds, and the cap
            # for timeoutSeconds. Scans are long and variable: pass
            # timeoutSeconds per request and keep the cap as the safety net.
            - name: WORKER_DEFAULT_TIMEOUT
              value: 24h
            - name: WORKER_MAX_TIMEOUT
              value: 24h
            # Simultaneous scans (each holds a node in NODE_MODE=oke).
            - name: MAX_CONCURRENT
              value: "10"
            - name: LOG_LEVEL
              value: info
            # Size classes and node mode are set by the overlays:
            #   deploy/overlays/oke               NODE_MODE=none (autoscaler-provided nodes)
            #   deploy/overlays/oke-managed-nodes NODE_MODE=oke + size-classes.yaml
            # Tuning knobs with sensible defaults (README, "Tuning knobs"):
            #   WORKER_SCHEDULE_TIMEOUT=2m  WORKER_IMAGE_PULL_TIMEOUT=3m
            #   NODE_PROVISION_TIMEOUT=15m  API_RETRY_WINDOW=2m  SWEEP_INTERVAL=5m
            #   ONE_POD_PER_NODE=true  KEEP_FAILED_PODS=false
            #   MAX_LOG_BYTES=262144  WORKER_LOG_TAIL_LINES=1000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
