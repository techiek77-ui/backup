apiVersion: apps/v1
kind: Deployment
metadata:
  name: podspawner
  labels:
    app.kubernetes.io/name: podspawner
spec:
  replicas: 1
  # Recreate, not RollingUpdate: job state is in-memory and a new instance
  # reaps every worker pod on start-up, so two instances must never overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: podspawner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podspawner
    spec:
      serviceAccountName: podspawner
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: podspawner:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Node label(s) worker pods must match. "k=v,k2=v2".
            - name: WORKER_NODE_SELECTOR
              value: "workload=worker"
            - name: WORKER_SERVICE_ACCOUNT
              value: podspawner-worker
            - name: WORKER_DEFAULT_IMAGE
              value: busybox:1.36
            - name: WORKER_DEFAULT_TIMEOUT
              value: 10m
            # Fail fast when no node matches the selector.
            - name: WORKER_SCHEDULE_TIMEOUT
              value: 2m
            # Fail fast when the worker image cannot be pulled.
            - name: WORKER_IMAGE_PULL_TIMEOUT
              value: 3m
            # Retry transient API-server errors this long before failing a job.
            - name: API_RETRY_WINDOW
              value: 2m
            # Reap worker pods that no in-flight job owns.
            - name: SWEEP_INTERVAL
              value: 5m
            - name: MAX_CONCURRENT
              value: "10"
            - name: KEEP_FAILED_PODS
              value: "false"
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
